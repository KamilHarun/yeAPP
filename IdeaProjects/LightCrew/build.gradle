plugins {
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'java'
}

group = 'az.lightcrew'
version = '1.0.0'
description = 'Admin Panel for Light Crew Azerbaijan'
java.sourceCompatibility = JavaVersion.VERSION_17

ext {
    jwtVersion = '0.12.3'
    mapstructVersion = '1.5.5.Final'
    commonsIoVersion = '2.15.0'
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Database
    implementation 'org.postgresql:postgresql:42.7.3'

    //WebClient
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    //Cloudinary files
    implementation 'com.cloudinary:cloudinary-http44:1.38.0'

    implementation 'org.apache.commons:commons-lang3:3.17.0'

    // JWT
    implementation "io.jsonwebtoken:jjwt-api:${jwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jwtVersion}"

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // MapStruct
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    //Liquibase
    implementation 'org.liquibase:liquibase-core'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // File Upload
    implementation "commons-io:commons-io:${commonsIoVersion}"

    // Dev Tools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    //Mail
    implementation 'com.sun.mail:jakarta.mail:2.0.1'
    implementation 'jakarta.activation:jakarta.activation-api:2.1.2'

    //Swagger API
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.30'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0'

    implementation 'software.amazon.awssdk:s3:2.25.28'
    implementation 'software.amazon.awssdk:netty-nio-client:2.25.28'
    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
